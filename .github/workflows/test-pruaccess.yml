name: Funds Bid History

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pruaccess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Install Chromium
        run: |
          playwright install --with-deps chromium

      - name: Create output directory
        run: |
          mkdir -p output_pruaccess

      - name: Run PruAccess diagnostic
        run: |
          python scripts/test_pruaccess.py

      - name: List diagnostic files
        if: always()
        run: |
          echo "=== output_pruaccess contents ==="
          ls -lah output_pruaccess || true

      - name: Upload PruAccess diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruaccess-test-results
          path: output_pruaccess/
          if-no-files-found: warn
