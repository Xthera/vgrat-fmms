name: Update Prudential Holdings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prudential-holdings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pypdf playwright

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Prudential holdings recovery
        run: |
          python -u scripts/update_prudential_holdings.py

      - name: Show recovery results
        run: |
          echo "=========================================="
          echo "PRUDENTIAL HOLDINGS RECOVERY COMPLETE"
          echo "=========================================="

          if [ -f output_holdings/run_summary.json ]; then
            python - <<'PY'
          import json

          with open("output_holdings/run_summary.json", encoding="utf-8") as f:
              data = json.load(f)

          print("Status:", data.get("status"))
          print("Successful:", data.get("successfulFunds"))
          print("Failed:", data.get("failedFunds"))

          print("\nFailed rows:")
          for item in data.get("failed", []):
              print(
                  f" - Row {item.get('excelRow')}: "
                  f"{item.get('error', 'Unknown error')}"
              )
          PY
          fi

      - name: Commit recovered holdings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output_holdings/

          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update Prudential holdings recovery"
            git push
          fi
