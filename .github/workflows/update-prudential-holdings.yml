name: Test Prudential Holdings Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-prudential-holdings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pypdf playwright

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run failed-fund recovery test
        run: |
          python -u scripts/update_prudential_holdings.py

      - name: Show recovery summary
        if: always()
        run: |
          echo "=========================================="
          echo "PRUDENTIAL HOLDINGS RECOVERY TEST"
          echo "=========================================="

          if [ -f output_holdings_recovery/run_summary.json ]; then
            python - <<'PY'
          import json

          with open(
              "output_holdings_recovery/run_summary.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("Status:", data.get("status"))
          print("Baseline failures:",
                data.get("failedFundsFromBaseline"))
          print("Recovery successful:",
                data.get("successfulFunds"))
          print("Recovery failed:",
                data.get("failedFunds"))

          print("\nRecovered:")
          for item in data.get("recovered", []):
              print(
                  f" - Row {item.get('excelRow')}: "
                  f"{item.get('fundName')} "
                  f"({item.get('topHoldingsCount')} holdings)"
              )

          print("\nStill failed:")
          for item in data.get("failed", []):
              print(
                  f" - Row {item.get('excelRow')}: "
                  f"{item.get('error')}"
              )
          PY
          fi

      - name: Upload recovery test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prudential-holdings-recovery
          path: output_holdings_recovery/
          if-no-files-found: warn
