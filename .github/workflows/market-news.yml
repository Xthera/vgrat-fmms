name: Market News - CNBC Collector

on:
  workflow_dispatch:

  # Every 3 hours starting at 00:00 Singapore time.
  #
  # Singapore = UTC+8
  #
  # 00:00 SGT = 16:00 UTC
  # 03:00 SGT = 19:00 UTC
  # 06:00 SGT = 22:00 UTC
  # 09:00 SGT = 01:00 UTC
  # 12:00 SGT = 04:00 UTC
  # 15:00 SGT = 07:00 UTC
  # 18:00 SGT = 10:00 UTC
  # 21:00 SGT = 13:00 UTC
  schedule:
    - cron: "20 16,19,22,1,4,7,10,13 * * *"

permissions:
  contents: write

concurrency:
  group: market-news-collector
  cancel-in-progress: false

jobs:
  fetch-market-news:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      # ==========================================================
      # INSTALL DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      # ==========================================================
      # VERIFY SCRIPT
      # ==========================================================

      - name: Verify collector
        run: |
          test -f scripts/fetch_market_news.py
          test -f scripts/requirements.txt

          echo "Collector files verified."

      # ==========================================================
      # SHOW RUNTIME
      # ==========================================================

      - name: Show runtime
        run: |
          echo "Python:"
          python --version

          echo ""
          echo "UTC time:"
          date -u

          echo ""
          echo "Singapore time:"
          TZ=Asia/Singapore date

          echo ""
          echo "Repository:"
          pwd

      # ==========================================================
      # SYNCHRONIZE WITH LATEST MAIN
      # ==========================================================

      - name: Synchronize with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      # ==========================================================
      # FETCH MARKET NEWS
      # ==========================================================

      - name: Fetch and process CNBC market news
        run: |
          python -u scripts/fetch_market_news.py

      # ==========================================================
      # DISPLAY CURRENT NEWS SUMMARY
      # ==========================================================

      - name: Display current news summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/market_news/current.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: data/market_news/current.json was not created."
              )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          print("")
          print("==========================================")
          print("CNBC MARKET NEWS")
          print("==========================================")
          print(
              f"Generated SGT: {data.get('generatedAtSgt')}"
          )
          print(
              f"Timezone: {data.get('timezone')}"
          )
          print(
              f"Window days: {data.get('windowDays')}"
          )
          print(
              f"Article count: {data.get('articleCount')}"
          )
          print("==========================================")
          PY

      # ==========================================================
      # VALIDATE CURRENT.JSON
      # ==========================================================

      - name: Validate current news JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/market_news/current.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: current.json does not exist."
              )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: current.json root must be an object."
              )

          articles = data.get("articles")

          if not isinstance(articles, list):
              raise SystemExit(
                  "ERROR: current.json articles must be an array."
              )

          seen_ids = set()

          for article in articles:
              article_id = article.get("id")

              if not article_id:
                  raise SystemExit(
                      "ERROR: Article without ID found."
                  )

              if article_id in seen_ids:
                  raise SystemExit(
                      f"ERROR: Duplicate article ID: {article_id}"
                  )

              seen_ids.add(article_id)

              required_fields = [
                  "source",
                  "title",
                  "publishedAtSgt",
                  "url",
              ]

              for field in required_fields:
                  if not article.get(field):
                      raise SystemExit(
                          f"ERROR: Article {article_id} "
                          f"missing required field: {field}"
                      )

          print(
              f"Validated {len(articles)} articles successfully."
          )

          print(
              f"Generated SGT: {data.get('generatedAtSgt')}"
          )

          print(
              f"Article count: {data.get('articleCount')}"
          )
          PY

      # ==========================================================
      # SHOW GIT CHANGES
      # ==========================================================

      - name: Show collector changes
        run: |
          echo "Git status:"
          git status --short

          echo ""
          echo "Collector-owned changes:"

          git diff -- \
            data/market_news/current.json \
            data/market_news/history/ \
            || true

      # ==========================================================
      # CONFIGURE GIT
      # ==========================================================

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ==========================================================
      # COMMIT AND PUSH
      # ==========================================================
      #
      # IMPORTANT:
      #
      # The collector ONLY stages:
      #
      #   data/market_news/current.json
      #   data/market_news/history/
      #
      # It deliberately does NOT stage:
      #
      #   data/market_news/analysis/
      #
      # This keeps ownership separated from the AI analysis workflow.
      #
      # ==========================================================

      - name: Commit and push collector data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          for attempt in 1 2 3 4 5
          do
            echo ""
            echo "=========================================="
            echo "Push attempt $attempt / 5"
            echo "=========================================="

            # ------------------------------------------------------
            # Get the newest main.
            # ------------------------------------------------------

            git fetch origin main

            git reset --hard origin/main

            # ------------------------------------------------------
            # Re-run the collector against the latest main.
            #
            # This is important when another workflow pushed while
            # this workflow was running.
            # ------------------------------------------------------

            python -u scripts/fetch_market_news.py

            # ------------------------------------------------------
            # Validate the regenerated current.json.
            # ------------------------------------------------------

            python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/market_news/current.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: current.json missing after collector run."
              )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          articles = data.get("articles")

          if not isinstance(articles, list):
              raise SystemExit(
                  "ERROR: current.json articles is not an array."
              )

          ids = []

          for article in articles:
              article_id = article.get("id")

              if not article_id:
                  raise SystemExit(
                      "ERROR: Article without ID."
                  )

              ids.append(article_id)

              for field in [
                  "source",
                  "title",
                  "publishedAtSgt",
                  "url",
              ]:
                  if not article.get(field):
                      raise SystemExit(
                          f"ERROR: Article {article_id} "
                          f"missing {field}."
                      )

          if len(ids) != len(set(ids)):
              raise SystemExit(
                  "ERROR: Duplicate article IDs."
              )

          print(
              f"Collector validation passed: "
              f"{len(articles)} articles."
          )
          PY

            # ------------------------------------------------------
            # IMPORTANT:
            #
            # Only stage collector-owned paths.
            #
            # analysis/ is intentionally excluded.
            # ------------------------------------------------------

            git add data/market_news/current.json
            git add data/market_news/history/

            # ------------------------------------------------------
            # Nothing changed.
            # ------------------------------------------------------

            if git diff --cached --quiet
            then
              echo "No collector changes to commit."
              exit 0
            fi

            # ------------------------------------------------------
            # Commit.
            # ------------------------------------------------------

            COMMIT_TIME="$(TZ=Asia/Singapore date '+%Y-%m-%d %H:%M:%S SGT')"

            git commit \
              -m "Update CNBC market news (${COMMIT_TIME})"

            # ------------------------------------------------------
            # Push.
            # ------------------------------------------------------

            if git push origin HEAD:main
            then
              echo ""
              echo "=========================================="
              echo "Collector push successful."
              echo "=========================================="
              exit 0
            fi

            # ------------------------------------------------------
            # Another workflow changed main.
            #
            # Reset and retry using the latest main.
            # ------------------------------------------------------

            echo ""
            echo "Push rejected."
            echo "Another workflow probably updated main."
            echo "Synchronizing and retrying..."

            git reset --hard origin/main

            sleep 5
          done

          echo ""
          echo "ERROR: Failed to push collector data after 5 attempts."
          exit 1
