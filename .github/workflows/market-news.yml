name: Market News - CNBC Collector

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-news-collector
  cancel-in-progress: false

jobs:
  fetch-market-news:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # --------------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # --------------------------------------------------------
      # 4. Verify required files
      # --------------------------------------------------------
      - name: Verify market news collector
        shell: bash
        run: |
          set -e

          test -f scripts/fetch_market_news.py

          echo "Market news collector found:"
          ls -lh scripts/fetch_market_news.py

      # --------------------------------------------------------
      # 5. Run CNA market news collector
      # --------------------------------------------------------
      - name: Fetch and process CNA market news
        run: |
          set -e
          python scripts/fetch_market_news.py

      # --------------------------------------------------------
      # 6. Display current article count
      # --------------------------------------------------------
      - name: Display current news summary
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/market_news/current.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: current.json was not created"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          print()
          print("==========================================")
          print("CURRENT 14-DAY NEWS")
          print("==========================================")
          print(
              "Generated:",
              data.get("generatedAtUtc")
          )
          print(
              "Window:",
              data.get("windowDays"),
              "days"
          )
          print(
              "Articles:",
              data.get("articleCount")
          )
          print()

          for article in data.get("articles", [])[:20]:
              print(
                  f"[{article.get('category')}] "
                  f"{article.get('title')}"
              )
          PY

      # --------------------------------------------------------
      # 7. Show Git changes
      # --------------------------------------------------------
      - name: Show changed files
        run: |
          git status --short

      # --------------------------------------------------------
      # 8. Commit market news data
      # --------------------------------------------------------
      - name: Commit market news data
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market_news/

          if git diff --cached --quiet; then
            echo "No market news changes to commit."
            exit 0
          fi

          git commit -m "Update CNA market news"

      # --------------------------------------------------------
      # 9. Rebase onto latest main
      # --------------------------------------------------------
      - name: Rebase onto latest main
        shell: bash
        run: |
          set -e

          git fetch origin main

          git rebase origin/main

      # --------------------------------------------------------
      # 10. Push
      # --------------------------------------------------------
      - name: Push market news update
        shell: bash
        run: |
          set -e

          git push origin HEAD:main
