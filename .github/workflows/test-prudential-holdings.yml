name: Test Prudential Top Holdings - All Funds

on:
  workflow_dispatch:

jobs:
  test-prudential-holdings:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Run all-fund Prudential Top Holdings extraction
        run: |
          python -u scripts/test_prudential_holdings.py

      - name: Upload all-fund holdings test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prudential-top-holdings-all-funds-${{ github.run_number }}
          path: |
            output_holdings/
          if-no-files-found: warn
