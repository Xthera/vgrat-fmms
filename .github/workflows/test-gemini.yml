name: Test Market News Gemini Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Verify required files
        run: |
          test -f scripts/analyze_market_news.py
          test -f scripts/requirements.txt
          test -f "Research Funds.xlsx"
          test -f data/market_news/current.json

          echo "Required files found."

      - name: Show input summary
        run: |
          python - <<'PY'
          import json

          path = "data/market_news/current.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          articles = data.get("articles", [])

          print(f"Source: {data.get('source')}")
          print(f"Generated: {data.get('generatedAtSgt')}")
          print(f"Article count: {len(articles)}")

          if articles:
              print(f"First article: {articles[0].get('title')}")
          PY

      - name: Run Gemini market news analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MARKET_NEWS_MODEL: gemini-3.8-flash
          MARKET_NEWS_BATCH_SIZE: "3"
          MARKET_NEWS_MAX_BATCHES: "1"
          MARKET_NEWS_AI_RETRIES: "3"
          MARKET_NEWS_RETRIEVAL_RETRIES: "2"
          MARKET_NEWS_RETRIEVAL_TIMEOUT: "20"
          MARKET_NEWS_MAX_ARTICLE_CHARS: "30000"
        run: |
          python -u scripts/analyze_market_news.py

      - name: Validate analysis output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/market_news/analysis/current.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: analysis/current.json was not created."
              )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          articles = data.get("articles", [])

          print("=" * 60)
          print("ANALYSIS OUTPUT")
          print("=" * 60)
          print(f"Article count: {len(articles)}")
          print(f"Generated: {data.get('generatedAtSgt')}")
          print(f"Timezone: {data.get('timezone')}")
          print("=" * 60)

          if articles:
              article = articles[0]

              print()
              print("First analyzed article:")
              print(article.get("title"))
              print()
              print("Geography:")
              print(
                  article.get("analysis", {}).get(
                      "geographicalImpact"
                  )
              )
              print()
              print("Sector:")
              print(
                  article.get("analysis", {}).get(
                      "sectorImpact"
                  )
              )
              print()
              print("Direction:")
              print(
                  article.get("analysis", {}).get(
                      "overallImpactDirection"
                  )
              )
              print()
              print("Severity:")
              print(
                  article.get("analysis", {}).get(
                      "impactSeverity"
                  )
              )
              print()
              print("Time horizon:")
              print(
                  article.get("analysis", {}).get(
                      "timeHorizon"
                  )
              )
              print()
              print("Confidence:")
              print(
                  article.get("analysis", {}).get(
                      "aiConfidence"
                  )
              )

          print()
          print("Analysis output validation passed.")
          PY

      - name: Show changed files
        run: |
          echo "Files generated or changed:"
          git status --short
