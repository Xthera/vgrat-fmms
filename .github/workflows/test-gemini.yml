      - name: Test Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from google import genai

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              raise RuntimeError("GEMINI_API_KEY is not available.")

          print("GEMINI_API_KEY detected.")
          print("Testing Gemini 3.8 Flash...")

          client = genai.Client(api_key=api_key)

          interaction = client.interactions.create(
              model="gemini-3.8-flash",
              input="Reply with exactly: GEMINI_TEST_OK"
          )

          print("Gemini response:")
          print(interaction.output_text)

          if "GEMINI_TEST_OK" not in interaction.output_text:
              raise RuntimeError(
                  "Gemini responded, but the expected test text was not returned."
              )

          print("Gemini API test PASSED.")
          PY
