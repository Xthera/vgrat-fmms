name: Build Funds Data - Daily 6AM SGT

on:
  # 6:00 AM Singapore Time (UTC+8)
  # = 10:00 PM UTC on the previous day
  schedule:
    - cron: "0 22 * * *"

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: write

# Prevent two runs of this workflow from pushing to main at the same time.
concurrency:
  group: build-funds-data-main
  cancel-in-progress: false

jobs:
  build-funds-data:

    runs-on: ubuntu-latest

    timeout-minutes: 180

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. SET UP PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f "scripts/requirements.txt" ]; then
            pip install -r "scripts/requirements.txt"
          fi

      # ============================================================
      # 4. VERIFY REQUIRED FILES
      # ============================================================

      - name: Verify required files
        run: |
          echo "=========================================="
          echo "REPOSITORY CHECK"
          echo "=========================================="

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository root contents:"
          ls -la

          echo ""
          echo "Excel files found:"
          find . -maxdepth 4 -type f \
            \( -iname "*.xlsm" -o -iname "*.xlsx" \) \
            -print

          echo ""
          echo "Build script:"
          if [ -f "scripts/build_funds_data.py" ]; then
            echo "FOUND: scripts/build_funds_data.py"
          else
            echo "ERROR: scripts/build_funds_data.py not found."
            exit 1
          fi

          echo ""
          echo "Excel master:"
          if [ -f "Funds Links.xlsm" ]; then
            echo "FOUND: Funds Links.xlsm"
          else
            echo ""
            echo "ERROR: Funds Links.xlsm was NOT found at:"
            echo "$(pwd)/Funds Links.xlsm"
            echo ""
            echo "Files currently available in the repository:"
            find . -maxdepth 4 -type f -print | sort
            echo ""
            exit 1
          fi

          echo ""
          echo "Required files verified."

      # ============================================================
      # 5. RUN BUILD
      # ============================================================

      - name: Run build_funds_data.py
        run: |
          python scripts/build_funds_data.py

      # ============================================================
      # 6. CREATE REFRESH COMPLETION TIMESTAMP
      #
      # Singapore timezone:
      # Asia/Singapore
      #
      # Example:
      # 2026-09-30 06:18:42 SGT
      # ============================================================

      - name: Record refresh completion time
        run: |
          REFRESH_TIME=$(TZ=Asia/Singapore date '+%Y-%m-%d %H:%M:%S SGT')
          REFRESH_DATE=$(TZ=Asia/Singapore date '+%Y-%m-%d')

          echo "REFRESH_TIME=$REFRESH_TIME" >> "$GITHUB_ENV"
          echo "REFRESH_DATE=$REFRESH_DATE" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "REFRESH COMPLETED"
          echo "Date: $REFRESH_DATE"
          echo "Time: $REFRESH_TIME"
          echo "=========================================="

      # ============================================================
      # 7. VALIDATE OUTPUT FILES
      # ============================================================

      - name: Validate generated data
        run: |
          test -f "data/funds.json"
          test -f "data/bid_history.json"

          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("data/funds.json"),
              Path("data/bid_history.json"),
          ]

          for path in files:
              print(f"Validating {path}...")

              with path.open("r", encoding="utf-8") as f:
                  data = json.load(f)

              if not isinstance(data, dict):
                  raise SystemExit(
                      f"{path} is not a valid JSON object."
                  )

              if "funds" not in data:
                  raise SystemExit(
                      f"{path} does not contain a funds array."
                  )

              if not isinstance(data["funds"], list):
                  raise SystemExit(
                      f"{path} funds field is not a list."
                  )

              print(
                  f"{path}: valid "
                  f"({len(data['funds'])} records)"
              )

          print("All generated data files are valid.")
          PY

      # ============================================================
      # 8. ADD GENERATED DATA
      # ============================================================

      - name: Stage generated data
        run: |
          git add data/funds.json
          git add data/bid_history.json

      # ============================================================
      # 9. COMMIT ONLY IF DATA CHANGED
      # ============================================================

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No data changes detected."
            echo ""
            echo "Refresh completed at:"
            echo "$REFRESH_TIME"
            exit 0
          fi

          git commit \
            -m "Daily fund data refresh - $REFRESH_DATE $REFRESH_TIME"

      # ============================================================
      # 10. UPDATE LOCAL MAIN BEFORE PUSH
      # ============================================================

      - name: Sync with latest main
        run: |
          git fetch origin main
          git rebase origin/main

      # ============================================================
      # 11. PUSH
      # ============================================================

      - name: Push refreshed data
        run: |
          git push origin HEAD:main

          echo "=========================================="
          echo "VGRAT FMS DATA REFRESH PUBLISHED"
          echo "Completed: $REFRESH_TIME"
          echo "=========================================="
