name: Validate PruAccess Extraction

on:
  workflow_dispatch:

jobs:
  validate-pruaccess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirement.txt
          pip install playwright

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run PruAccess extraction
        run: |
          python scripts/test_pruaccess.py

      - name: Run PruAccess validation
        run: |
          python scripts/test_pruaccess_validation.py

      - name: Upload PruAccess extraction files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruaccess-extraction
          path: output_pruaccess/
          if-no-files-found: warn
