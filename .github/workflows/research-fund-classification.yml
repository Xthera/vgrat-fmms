name: Research Fund Geographic and Sector Exposure

on:
  workflow_dispatch:

  # Uncomment when you want automatic research refreshes.
  # schedule:
  #   - cron: "0 2 1 * *"

permissions:
  contents: write

concurrency:
  group: fund-classification-research
  cancel-in-progress: false

jobs:
  research-funds:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # --------------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            openpyxl \
            requests \
            beautifulsoup4 \
            lxml \
            pdfplumber

      # --------------------------------------------------------
      # 4. Check required files
      # --------------------------------------------------------
      - name: Check required files
        run: |
          test -f "Funds Links.xlsm"
          test -f "scripts/research_fund_classification.py"

      # --------------------------------------------------------
      # 5. Run research
      # --------------------------------------------------------
      - name: Research fund geographic and sector exposure
        run: |
          python scripts/research_fund_classification.py

      # --------------------------------------------------------
      # 6. Show output
      # --------------------------------------------------------
      - name: Show research output
        run: |
          test -f "output_fund_research/fund_research.json"
          python - <<'PY'
          import json

          path = "output_fund_research/fund_research.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Fund count:", data.get("fundCount"))
          print("Successful:", data.get("successfulCount"))
          print("Unresolved:", data.get("unresolvedCount"))
          print("Output:", path)
          PY

      # --------------------------------------------------------
      # 7. Commit research JSON
      # --------------------------------------------------------
      - name: Commit research JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output_fund_research/fund_research.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update fund geographic and sector research"
            git push
          fi
