name: Market News - AI Analysis

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Market News - CNBC Collector"
    types:
      - completed

permissions:
  contents: write

jobs:
  analyze-market-news:
    name: Analyze Market News

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip

          if [ -f scripts/requirements.txt ]; then
            pip install -r scripts/requirements.txt
          fi

      - name: Wait 15 minutes after collector
        if: github.event_name == 'workflow_run'
        run: |
          echo "Market News - CNBC Collector completed successfully."
          echo "Waiting 15 minutes before AI analysis..."
          sleep 900
          echo "15-minute wait completed."

      - name: Analyze market news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MARKET_NEWS_MODEL: gemini-3.5-flash-lite
        run: |
          python -u scripts/analyze_market_news.py

      - name: Commit analysis results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market_news/analysis/

          if git diff --cached --quiet; then
            echo "No analysis changes to commit."
            exit 0
          fi

          git commit -m "Update market news AI analysis"
          git push
