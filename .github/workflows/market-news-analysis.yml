name: Market News - AI Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-market-news:
    name: Analyze 1 Newest Market News Article
    runs-on: ubuntu-latest

    concurrency:
      group: market-news-ai-analysis
      cancel-in-progress: false

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================================
      # VERIFY INPUTS
      # ==========================================================

      - name: Verify production inputs
        run: |
          echo "Repository root:"
          pwd

          echo ""
          echo "Checking scripts:"
          ls -la scripts

          echo ""
          echo "Checking market news:"
          ls -la data/market_news

          echo ""
          echo "Required files:"
          test -f "scripts/analyze_market_news.py"
          test -f "data/market_news/current.json"

          echo ""
          echo "All required files found."

      # ==========================================================
      # GEMINI ANALYSIS
      # ==========================================================

      - name: Analyze newest 1 article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_TIMEOUT_SECONDS: "180"
          GEMINI_MAX_OUTPUT_TOKENS: "8192"
        run: |
          python -u scripts/analyze_market_news.py

      # ==========================================================
      # SHOW RESULT
      # ==========================================================

      - name: Show analysis result
        if: always()
        run: |
          echo "=========================================="
          echo "ANALYSIS RESULT"
          echo "=========================================="

          if [ -f "data/market_news/analysis/current.json" ]; then
            ls -lh "data/market_news/analysis/current.json"

            echo ""
            echo "Latest analysis summary:"

            python - <<'PY'
          import json

          path = "data/market_news/analysis/current.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Model:", data.get("configuration", {}).get("model"))
          print("Generated:", data.get("generatedAt"))

          source = data.get("source", {})
          print("Source article count:", source.get("articleCount"))

          batch = data.get("batch", {})
          print("Batch number:", batch.get("batchNumber"))
          print("Articles analyzed:", batch.get("articleCount"))

          request = data.get("request", {})
          print("Attempts used:", request.get("attemptsUsed"))
          print("Response seconds:", request.get("responseSeconds"))

          validation = data.get("validation", {})
          print("Validation:", validation.get("passed"))

          print("")
          print("Article IDs:")

          for article_id in batch.get("articleIds", []):
              print("-", article_id)

          print("")
          print("Retry history:")

          for attempt in request.get("retryHistory", []):
              print("-", attempt)
          PY
          else
            echo "No analysis/current.json exists."
          fi

      # ==========================================================
      # COMMIT SUCCESSFUL ANALYSIS
      # ==========================================================

      - name: Commit successful analysis
        if: success()
        run: |
          if [ ! -f "data/market_news/analysis/current.json" ]; then
            echo "No analysis file to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "data/market_news/analysis/current.json"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Analyze 1 market news article"
          git push
