name: Market News - AI Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-market-news:
    name: Analyze 5 Newest Market News Articles
    runs-on: ubuntu-latest

    concurrency:
      group: market-news-ai-analysis
      cancel-in-progress: false

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      # ======================================================
      # VERIFY INPUTS
      # ======================================================

      - name: Verify production inputs
        run: |
          test -f "data/market_news/current.json"
          test -f "Research Funds.xlsx"

          echo "Production current.json:"
          ls -lh "data/market_news/current.json"

          echo "Research Funds.xlsx:"
          ls -lh "Research Funds.xlsx"

      # ======================================================
      # RUN ONE REAL-DATA BATCH
      # ======================================================

      - name: Analyze newest 5 pending articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
          GEMINI_TIMEOUT_SECONDS: 180
          GEMINI_MAX_OUTPUT_TOKENS: 16384
        run: |
          python -u scripts/analyze_market_news.py

      # ======================================================
      # SHOW RESULT
      # ======================================================

      - name: Show analysis result
        if: always()
        run: |
          if [ -f "data/market_news/analysis/current.json" ]; then
            echo "=========================================="
            echo "Analysis file created:"
            echo "=========================================="
            ls -lh "data/market_news/analysis/current.json"

            echo ""
            echo "Batch summary:"
            python - <<'PY'
          import json

          path = "data/market_news/analysis/current.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Successful batches:",
                data.get("totalSuccessfulBatches", 0))

          print("Successful articles:",
                data.get("totalSuccessfulArticles", 0))

          batches = data.get("batches", [])

          if batches:
              batch = batches[-1]

              print("Latest batch:",
                    batch.get("batchNumber"))

              request = batch.get("request", {})

              print("Articles in batch:",
                    request.get("articleCount"))

              print("Response seconds:",
                    request.get("responseSeconds"))

              print("Model:",
                    batch.get("model"))
          PY
          else
            echo "No analysis/current.json was created."
          fi

      # ======================================================
      # COMMIT SUCCESSFUL ANALYSIS
      # ======================================================

      - name: Commit successful analysis
        if: success()
        run: |
          if [ ! -f "data/market_news/analysis/current.json" ]; then
            echo "No analysis file to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "data/market_news/analysis/current.json"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Analyze market news batch"

          git push
