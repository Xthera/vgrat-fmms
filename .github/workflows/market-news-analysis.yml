name: Market News - AI Analysis

on:
  workflow_dispatch:

  push:
    paths:
      - "data/market_news/current.json"

permissions:
  contents: write

concurrency:
  group: market-news-analysis
  cancel-in-progress: false

jobs:
  analyze-market-news:
    runs-on: ubuntu-latest

    timeout-minutes: 180

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      # ==========================================================
      # VERIFY FILES
      # ==========================================================

      - name: Verify analysis files
        run: |
          test -f scripts/analyze_market_news.py
          test -f scripts/requirements.txt
          test -f "Research Funds.xlsx"
          test -f data/market_news/current.json

          echo "Required files found."

      # ==========================================================
      # RUNTIME INFORMATION
      # ==========================================================

      - name: Show runtime information
        run: |
          echo "Python:"
          python --version

          echo "PyTorch:"
          python -c "import torch; print(torch.__version__)"

          echo "Transformers:"
          python -c "import transformers; print(transformers.__version__)"

          echo "CPU:"
          nproc

          echo "Memory:"
          free -h

          echo "Disk:"
          df -h

      # ==========================================================
      # SYNCHRONIZE WITH MAIN
      # ==========================================================

      - name: Synchronize with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      # ==========================================================
      # RUN ANALYSIS
      # ==========================================================

      - name: Run Market News AI Analysis
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          MARKET_NEWS_MODEL: "Qwen/Qwen3-4B-Instruct-2507"
          MARKET_NEWS_AI_RETRIES: "3"
          MARKET_NEWS_RETRIEVAL_RETRIES: "2"
        run: |
          python -u scripts/analyze_market_news.py

      # ==========================================================
      # VALIDATE OUTPUT
      # ==========================================================

      - name: Validate analysis output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/market_news/analysis/current.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: analysis/current.json was not created."
              )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: analysis/current.json is not an object."
              )

          articles = data.get("articles")

          if not isinstance(articles, list):
              raise SystemExit(
                  "ERROR: articles is not an array."
              )

          ids = []

          for article in articles:
              if not article.get("id"):
                  raise SystemExit(
                      "ERROR: Article without ID."
                  )

              if not article.get("title"):
                  raise SystemExit(
                      "ERROR: Article without title."
                  )

              if not article.get("url"):
                  raise SystemExit(
                      "ERROR: Article without URL."
                  )

              if not article.get("publishedAtSgt"):
                  raise SystemExit(
                      "ERROR: Article without publishedAtSgt."
                  )

              analysis = article.get("analysis")

              if not isinstance(analysis, dict):
                  raise SystemExit(
                      "ERROR: Article missing analysis."
                  )

              ids.append(article["id"])

          if len(ids) != len(set(ids)):
              raise SystemExit(
                  "ERROR: Duplicate article IDs."
              )

          print(
              f"Validated {len(articles)} analyzed articles."
          )
          print(
              f"Generated: {data.get('generatedAtSgt')}"
          )
          print(
              f"Model: {data.get('analysisModel')}"
          )
          PY

      # ==========================================================
      # SHOW RESULT
      # ==========================================================

      - name: Display analysis summary
        run: |
          python - <<'PY'
          import json

          with open(
              "data/market_news/analysis/current.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("")
          print("==========================================")
          print("MARKET NEWS ANALYSIS")
          print("==========================================")
          print(
              f"Generated: {data.get('generatedAtSgt')}"
          )
          print(
              f"Model: {data.get('analysisModel')}"
          )
          print(
              f"Articles: {data.get('articleCount')}"
          )
          print("==========================================")
          PY

      # ==========================================================
      # GIT STATUS
      # ==========================================================

      - name: Show git changes
        run: |
          git status --short

      # ==========================================================
      # COMMIT / PUSH
      # ==========================================================

      - name: Commit and push analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5
          do
            echo "=========================================="
            echo "Push attempt $attempt / 5"
            echo "=========================================="

            git fetch origin main

            git reset --hard origin/main

            # Re-run analysis after synchronization so that any
            # analysis committed by another run is preserved.
            python -u scripts/analyze_market_news.py

            git add data/market_news/analysis/

            if git diff --cached --quiet
            then
              echo "No analysis changes to commit."
              exit 0
            fi

            git commit \
              -m "Update market news analysis"

            if git push origin HEAD:main
            then
              echo "Analysis pushed successfully."
              exit 0
            fi

            echo "Push rejected. Retrying..."
            git reset --hard origin/main
            sleep 5
          done

          echo "ERROR: Failed to push after 5 attempts."
          exit 1
