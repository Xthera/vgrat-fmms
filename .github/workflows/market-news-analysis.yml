name: Market News - AI Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-news-analysis
  cancel-in-progress: false

jobs:
  analyze-market-news:
    name: Analyze Market News
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # PYTHON
      # ==========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================================
      # RUN ANALYZER
      #
      # The Python script intentionally stops at the first error.
      # Successful articles are already saved individually.
      # ==========================================================
      - name: Analyze market news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MARKET_NEWS_MODEL: gemini-3.8-flash
        run: |
          python -u scripts/analyze_market_news.py

      # ==========================================================
      # COMMIT PARTIAL SUCCESS
      #
      # IMPORTANT:
      # This MUST run even when the analyzer fails.
      #
      # Example:
      #   Article 1-12 = successful and saved
      #   Article 13   = HTTP 429
      #
      # The job becomes failed, but this step still commits
      # Articles 1-12.
      # ==========================================================
      - name: Commit successful analyses
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market_news/analysis/

          if git diff --cached --quiet; then
            echo "No analysis changes to commit."
          else
            git commit -m "Update market news AI analysis"
            git push
          fi
