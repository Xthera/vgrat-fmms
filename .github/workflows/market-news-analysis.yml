name: Market News - AI Analysis

on:
  # ==========================================================
  # MANUAL RUN ONLY
  # ==========================================================

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-news-analysis
  cancel-in-progress: false

jobs:
  analyze-market-news:
    runs-on: ubuntu-latest

    timeout-minutes: 180

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main

      # ==========================================================
      # SYNCHRONIZE WITH LATEST MAIN
      # ==========================================================

      - name: Synchronize with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      # ==========================================================
      # VERIFY FILES
      # ==========================================================

      - name: Verify analysis files
        run: |
          test -f scripts/analyze_market_news.py
          test -f scripts/requirements.txt
          test -f "Research Funds.xlsx"
          test -f data/market_news/current.json

          echo "Required files found."

      # ==========================================================
      # RUNTIME INFORMATION
      # ==========================================================

      - name: Show runtime information
        run: |
          echo "=========================================="
          echo "RUNTIME INFORMATION"
          echo "=========================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Google GenAI:"
          python -c "import google.genai; print('google-genai installed')"

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Disk:"
          df -h

      # ==========================================================
      # RUN ANALYSIS
      # ==========================================================
      #
      # ONE ARTICLE = ONE GEMINI REQUEST
      #
      # Successful article:
      #   saved permanently to history
      #
      # Failed article:
      #   remains pending
      #
      # HTTP 429:
      #   stops the run immediately
      #
      # No same-run Gemini retries.
      # ==========================================================

      - name: Run Market News AI Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
        run: |
          python -u scripts/analyze_market_news.py

      # ==========================================================
      # VALIDATE OUTPUT
      # ==========================================================

      - name: Validate analysis output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/market_news/analysis/current.json"
          )

          if not path.exists():
              raise SystemExit(
                  "ERROR: analysis/current.json was not created."
              )

          with path.open(
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: analysis/current.json is not an object."
              )

          articles = data.get("articles")

          if not isinstance(articles, list):
              raise SystemExit(
                  "ERROR: articles is not an array."
              )

          ids = []

          for article in articles:

              if not isinstance(article, dict):
                  raise SystemExit(
                      "ERROR: Invalid article record."
                  )

              if not article.get("id"):
                  raise SystemExit(
                      "ERROR: Article without ID."
                  )

              if not article.get("title"):
                  raise SystemExit(
                      "ERROR: Article without title."
                  )

              if not article.get("url"):
                  raise SystemExit(
                      "ERROR: Article without URL."
                  )

              if not article.get("publishedAtSgt"):
                  raise SystemExit(
                      "ERROR: Article without publishedAtSgt."
                  )

              analysis = article.get("analysis")

              if not isinstance(analysis, dict):
                  raise SystemExit(
                      "ERROR: Article missing analysis."
                  )

              # ------------------------------------------------
              # Geography validation
              # ------------------------------------------------

              geography = analysis.get(
                  "geographyImpact"
              )

              if not isinstance(
                  geography,
                  dict
              ):
                  raise SystemExit(
                      "ERROR: Article missing geographyImpact."
                  )

              geography_labels = geography.get(
                  "labels"
              )

              if not isinstance(
                  geography_labels,
                  list
              ):
                  raise SystemExit(
                      "ERROR: geographyImpact.labels "
                      "is not an array."
                  )

              if not 1 <= len(geography_labels) <= 3:
                  raise SystemExit(
                      "ERROR: Geography must contain "
                      "1-3 labels."
                  )

              if not geography.get(
                  "explanation"
              ):
                  raise SystemExit(
                      "ERROR: Geography explanation missing."
                  )

              # ------------------------------------------------
              # Industry sector validation
              # ------------------------------------------------

              sector = analysis.get(
                  "industrySectorImpact"
              )

              if not isinstance(
                  sector,
                  dict
              ):
                  raise SystemExit(
                      "ERROR: Article missing "
                      "industrySectorImpact."
                  )

              sector_labels = sector.get(
                  "labels"
              )

              if not isinstance(
                  sector_labels,
                  list
              ):
                  raise SystemExit(
                      "ERROR: industrySectorImpact.labels "
                      "is not an array."
                  )

              if not 1 <= len(sector_labels) <= 3:
                  raise SystemExit(
                      "ERROR: Industry sector must contain "
                      "1-3 labels."
                  )

              if not sector.get(
                  "explanation"
              ):
                  raise SystemExit(
                      "ERROR: Industry sector "
                      "explanation missing."
                  )

              ids.append(
                  article["id"]
              )

          if len(ids) != len(set(ids)):
              raise SystemExit(
                  "ERROR: Duplicate article IDs."
              )

          print(
              f"Validated {len(articles)} analyzed articles."
          )

          print(
              f"Generated: {data.get('generatedAtSgt')}"
          )

          print(
              f"Model: {data.get('analysisModel')}"
          )

          print("")
          print(
              "Geography and industry-sector analysis "
              "structure validated."
          )
          PY

      # ==========================================================
      # SHOW RESULT
      # ==========================================================

      - name: Display analysis summary
        run: |
          python - <<'PY'
          import json

          with open(
              "data/market_news/analysis/current.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("")
          print("==========================================")
          print("MARKET NEWS ANALYSIS")
          print("==========================================")

          print(
              f"Generated: {data.get('generatedAtSgt')}"
          )

          print(
              f"Model: {data.get('analysisModel')}"
          )

          print(
              f"Articles: {data.get('articleCount')}"
          )

          print("==========================================")
          PY

      # ==========================================================
      # GIT STATUS
      # ==========================================================

      - name: Show git changes
        run: |
          git status --short

      # ==========================================================
      # COMMIT
      # ==========================================================

      - name: Commit analysis results
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market_news/analysis/current.json
          git add data/market_news/analysis/history/

          if git diff --cached --quiet
          then
            echo "No analysis changes to commit."
            exit 0
          fi

          git commit \
            -m "Update market news analysis"

      # ==========================================================
      # PUSH
      # ==========================================================
      #
      # IMPORTANT:
      #
      # We DO NOT rerun the AI analysis when a push fails.
      #
      # The analysis has already been completed and successful
      # articles have already been written to history.
      #
      # We only synchronize Git and retry the push.
      # ==========================================================

      - name: Push analysis results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          for attempt in 1 2 3 4 5
          do
            echo "=========================================="
            echo "Push attempt $attempt / 5"
            echo "=========================================="

            if git push origin HEAD:main
            then
              echo "Analysis pushed successfully."
              exit 0
            fi

            echo ""
            echo "Push rejected."
            echo "Synchronizing with latest main..."
            echo ""

            git fetch origin main

            git rebase origin/main

            sleep 5
          done

          echo "ERROR: Failed to push after 5 attempts."
          exit 1
