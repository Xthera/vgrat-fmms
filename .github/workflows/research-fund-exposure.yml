name: Research Fund Exposure

on:
  # ============================================================
  # DAILY AUTO RUN
  # 00:00 Singapore Time = 16:00 UTC (previous day)
  # ============================================================
  schedule:
    - cron: "0 16 * * *"

  # ============================================================
  # MANUAL RUN
  # ============================================================
  workflow_dispatch:

permissions:
  contents: write

# ==============================================================
# IMPORTANT:
# This concurrency group ONLY controls duplicate instances of
# THIS workflow.
#
# It does NOT block:
# - Build Funds Data
# - Market News
# - Other workflows
#
# Therefore all 3 workflows can run at the same time.
# ==============================================================
concurrency:
  group: fund-exposure-research
  cancel-in-progress: false

jobs:

  research-exposure:

    runs-on: ubuntu-latest

    timeout-minutes: 180

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ========================================================
      # 2. SETUP PYTHON
      # ========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ========================================================
      # 3. VERIFY REQUIRED FILES
      # ========================================================
      - name: Verify required files
        shell: bash
        run: |
          set -e

          echo "Checking required files..."

          test -f "Funds Links.xlsx"
          test -f "scripts/research_fund_exposure.py"
          test -f "scripts/exposure_categories.txt"

          echo "Required files found."

      # ========================================================
      # 4. SHOW EXPOSURE VOCABULARY
      # ========================================================
      - name: Show exposure vocabulary
        shell: bash
        run: |
          echo "============================================================"
          echo "Allowed Geography / Sector Vocabulary"
          echo "============================================================"

          cat scripts/exposure_categories.txt

          echo "============================================================"

      # ========================================================
      # 5. INSTALL DEPENDENCIES
      # ========================================================
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          pip install \
            "torch>=2.5" \
            "transformers>=4.51" \
            "accelerate>=1.0" \
            "openpyxl>=3.1" \
            "pypdf>=5.0" \
            "beautifulsoup4>=4.12" \
            "requests>=2.32"

      # ========================================================
      # 6. RUN AI FUND EXPOSURE RESEARCH
      # ========================================================
      - name: Research fund geography and sector
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/research_fund_exposure.py

      # ========================================================
      # 7. VERIFY OUTPUT
      # ========================================================
      - name: Verify output
        shell: bash
        run: |
          set -e

          OUTPUT="data/fund_exposure.json"

          if [ ! -f "$OUTPUT" ]; then
            echo "ERROR: $OUTPUT was not created."
            exit 1
          fi

          echo "Output created:"
          ls -lh "$OUTPUT"

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/fund_exposure.json")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("ERROR: Output JSON root is not an object.")

          if "funds" not in data:
              raise SystemExit("ERROR: Output JSON does not contain 'funds'.")

          if not isinstance(data["funds"], list):
              raise SystemExit("ERROR: 'funds' is not a list.")

          print(f"Funds researched: {len(data['funds'])}")

          for i, fund in enumerate(data["funds"], start=1):

              if not isinstance(fund, dict):
                  raise SystemExit(
                      f"ERROR: Fund record #{i} is not an object."
                  )

              geography = fund.get("geography", [])
              sector = fund.get("sector", [])

              if not isinstance(geography, list):
                  raise SystemExit(
                      f"ERROR: Fund #{i} geography is not a list."
                  )

              if not isinstance(sector, list):
                  raise SystemExit(
                      f"ERROR: Fund #{i} sector is not a list."
                  )

              if len(geography) > 3:
                  raise SystemExit(
                      f"ERROR: Fund #{i} has more than 3 geography categories."
                  )

              if len(sector) > 3:
                  raise SystemExit(
                      f"ERROR: Fund #{i} has more than 3 sector categories."
                  )

              # Percentages must not appear in the final categories.
              for category in geography + sector:

                  if not isinstance(category, str):
                      raise SystemExit(
                          f"ERROR: Fund #{i} contains non-string category."
                      )

                  if "%" in category:
                      raise SystemExit(
                          f"ERROR: Percentage found in fund #{i}: {category}"
                      )

          print("Output validation passed.")

          PY

      # ========================================================
      # 8. SHOW SUMMARY
      # ========================================================
      - name: Show research summary
        shell: bash
        run: |
          python - <<'PY'
          import json

          with open("data/fund_exposure.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          summary = data.get("summary", {})

          print("")
          print("============================================================")
          print("FUND EXPOSURE RESEARCH SUMMARY")
          print("============================================================")

          for key, value in summary.items():
              print(f"{key}: {value}")

          print("============================================================")
          print("")

          PY

      # ========================================================
      # 9. CONFIGURE GIT
      # ========================================================
      - name: Configure Git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ========================================================
      # 10. CHECK FOR CHANGES
      # ========================================================
      - name: Check for changes
        id: changes
        shell: bash
        run: |
          git status --short

          if git diff --quiet -- data/fund_exposure.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in fund_exposure.json."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      # ========================================================
      # 11. COMMIT LOCAL RESULT
      # ========================================================
      - name: Commit exposure data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git add data/fund_exposure.json

          git commit \
            -m "Update fund geography and sector exposure"

      # ========================================================
      # 12. SAFE PUSH
      #
      # Another workflow may have pushed to main while this
      # workflow was researching.
      #
      # Therefore:
      #   fetch latest main
      #   rebase our commit
      #   push
      #
      # Retry a few times in case another workflow pushes between
      # fetch/rebase/push.
      # ========================================================
      - name: Push exposure data safely
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          BRANCH="${GITHUB_REF_NAME}"

          for attempt in 1 2 3 4 5
          do
            echo "============================================================"
            echo "Push attempt $attempt / 5"
            echo "============================================================"

            git fetch origin "$BRANCH"

            git rebase "origin/$BRANCH"

            if git push origin "HEAD:$BRANCH"; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed because the remote changed."
            echo "Retrying..."

            sleep 5
          done

          echo "ERROR: Unable to push after 5 attempts."
          exit 1
