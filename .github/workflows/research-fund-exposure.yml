name: AI Fund Exposure Research

on:
  workflow_dispatch:

  schedule:
    # 00:00 Singapore time (UTC+8)
    # = 16:00 UTC previous day
    - cron: "0 16 * * *"

permissions:
  contents: write

concurrency:
  group: fund-exposure-research
  cancel-in-progress: false

jobs:

  research-fund-exposure:

    runs-on: ubuntu-latest

    timeout-minutes: 180

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ======================================================
      # 3. VERIFY REQUIRED FILES
      # ======================================================

      - name: Verify repository files
        run: |

          echo "Checking required files..."

          test -f "Funds Links.xlsx"

          test -f "scripts/research_fund_exposure.py"

          test -f "scripts/exposure_categories.txt"

          echo "Required files found."

          echo ""
          echo "Repository structure:"
          echo ""

          ls -la

          echo ""
          echo "Scripts:"
          echo ""

          ls -la scripts


      # ======================================================
      # 4. INSTALL DEPENDENCIES
      # ======================================================

      - name: Install Python dependencies
        run: |

          python -m pip install --upgrade pip

          pip install \
            "torch>=2.5" \
            "transformers>=4.51" \
            "accelerate>=1.0" \
            "openpyxl>=3.1" \
            "pypdf>=5.0" \
            "beautifulsoup4>=4.12" \
            "requests>=2.32"


      # ======================================================
      # 5. SHOW CONFIGURATION
      # ======================================================

      - name: Show exposure configuration
        run: |

          echo "================================================"
          echo "Exposure categories"
          echo "================================================"

          cat scripts/exposure_categories.txt

          echo ""
          echo "================================================"
          echo "Python version"
          echo "================================================"

          python --version


      # ======================================================
      # 6. RUN AI RESEARCH
      # ======================================================

      - name: Research fund exposure
        env:

          HF_MODEL: Qwen/Qwen3-1.7B

          REQUEST_TIMEOUT: "30"

          MAX_SEARCH_RESULTS: "8"

          MAX_DOCUMENTS_PER_FUND: "5"

          HF_HUB_DISABLE_TELEMETRY: "1"

        run: |

          python scripts/research_fund_exposure.py


      # ======================================================
      # 7. VALIDATE OUTPUT
      # ======================================================

      - name: Validate exposure output
        run: |

          test -f "data/fund_exposure.json"

          python - <<'PY'

          import json

          from pathlib import Path


          output_path = Path(
              "data/fund_exposure.json"
          )

          category_path = Path(
              "scripts/exposure_categories.txt"
          )


          # --------------------------------------------------
          # Load output
          # --------------------------------------------------

          with output_path.open(
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          assert isinstance(
              data,
              dict
          )


          assert isinstance(
              data.get("funds"),
              list
          )


          # --------------------------------------------------
          # Load allowed categories
          # --------------------------------------------------

          geography = []

          sector = []

          current = None


          with category_path.open(
              "r",
              encoding="utf-8"
          ) as f:

              for raw_line in f:

                  line = raw_line.strip()


                  if not line:
                      continue


                  if line.startswith("#"):
                      continue


                  if line.upper() == "[GEOGRAPHY]":
                      current = "geography"
                      continue


                  if line.upper() == "[SECTOR]":
                      current = "sector"
                      continue


                  if current == "geography":
                      geography.append(line)


                  elif current == "sector":
                      sector.append(line)


          geography_set = set(
              geography
          )

          sector_set = set(
              sector
          )


          # --------------------------------------------------
          # Validate every fund
          # --------------------------------------------------

          for fund in data["funds"]:

              geo = fund.get(
                  "geography",
                  []
              )

              sec = fund.get(
                  "sector",
                  []
              )


              assert isinstance(
                  geo,
                  list
              )

              assert isinstance(
                  sec,
                  list
              )


              assert len(geo) <= 3

              assert len(sec) <= 3


              for value in geo:

                  assert value in geography_set, (
                      f"Invalid geography "
                      f"category: {value}"
                  )


              for value in sec:

                  assert value in sector_set, (
                      f"Invalid sector "
                      f"category: {value}"
                  )


          print(
              f"Validated "
              f"{len(data['funds'])} funds."
          )

          print(
              "Maximum geography: 3"
          )

          print(
              "Maximum sector: 3"
          )

          print(
              "Percentages: not stored"
          )

          print(
              "Vocabulary enforcement: enabled"
          )

          PY


      # ======================================================
      # 8. SHOW RESULT SUMMARY
      # ======================================================

      - name: Show result summary
        run: |

          python - <<'PY'

          import json

          with open(
              "data/fund_exposure.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          print("")
          print(
              "=============================================="
          )

          print(
              "AI FUND EXPOSURE SUMMARY"
          )

          print(
              "=============================================="
          )

          print(
              f"Funds processed: "
              f"{data['summary']['fundsProcessed']}"
          )

          print(
              f"Successful: "
              f"{data['summary']['successful']}"
          )

          print(
              f"No source: "
              f"{data['summary']['noSource']}"
          )

          print(
              f"No reliable exposure: "
              f"{data['summary']['noReliableExposure']}"
          )

          print(
              f"AI errors: "
              f"{data['summary']['aiErrors']}"
          )

          print(
              "=============================================="
          )

          PY


      # ======================================================
      # 9. COMMIT RESULT
      # ======================================================

      - name: Commit exposure data
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/fund_exposure.json


          if git diff --cached --quiet; then

            echo "No exposure changes."

            exit 0

          fi


          git commit \
            -m "Update AI fund exposure research"


          git push
