name: AI Fund Exposure Research

on:
  workflow_dispatch:

  schedule:
    # 00:00 Singapore time
    # Singapore = UTC+8
    # Therefore 16:00 UTC previous day
    - cron: "0 16 * * *"

permissions:
  contents: write

concurrency:
  group: fund-exposure-research
  cancel-in-progress: false

jobs:
  research-fund-exposure:

    runs-on: ubuntu-latest

    timeout-minutes: 180

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # 3. Install dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            "torch>=2.5" \
            "transformers>=4.51" \
            "accelerate>=1.0" \
            "openpyxl>=3.1" \
            "pypdf>=5.0" \
            "beautifulsoup4>=4.12" \
            "requests>=2.32"

      # ======================================================
      # 4. Run AI research
      # ======================================================

      - name: Research fund geography and sector
        env:
          HF_MODEL: Qwen/Qwen3-1.7B
          FUNDS_LINKS_FILE: Funds Links.xlsx
          EXPOSURE_OUTPUT: data/fund_exposure.json
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python scripts/research_fund_exposure.py

      # ======================================================
      # 5. Validate output exists
      # ======================================================

      - name: Validate output
        run: |
          test -f data/fund_exposure.json

          python - <<'PY'
          import json

          path = "data/fund_exposure.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          assert isinstance(data, dict)
          assert isinstance(data.get("funds"), list)

          for fund in data["funds"]:
              assert isinstance(
                  fund.get("geography", []),
                  list
              )

              assert isinstance(
                  fund.get("sector", []),
                  list
              )

              assert len(
                  fund.get("geography", [])
              ) <= 3

              assert len(
                  fund.get("sector", [])
              ) <= 3

          print(
              f"Validated {len(data['funds'])} funds."
          )
          PY

      # ======================================================
      # 6. Commit result
      # ======================================================

      - name: Commit exposure data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fund_exposure.json

          if git diff --cached --quiet; then
            echo "No exposure changes."
            exit 0
          fi

          git commit -m "Update AI fund exposure research"

          git push
