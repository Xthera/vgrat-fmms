name: Research Fund Exposure

on:
  # ============================================================
  # DAILY AUTO RUN
  # 00:00 Singapore Time = 16:00 UTC (previous day)
  # ============================================================
  schedule:
    - cron: "0 16 * * *"

  # ============================================================
  # MANUAL RUN
  # ============================================================
  workflow_dispatch:

permissions:
  contents: write

# ==============================================================
# IMPORTANT:
# This concurrency group ONLY controls duplicate instances of
# THIS workflow.
#
# It does NOT block:
# - Build Funds Data
# - Market News
# - Other workflows
#
# Therefore all 3 workflows can run at the same time.
# ==============================================================
concurrency:
  group: fund-exposure-research
  cancel-in-progress: false

jobs:

  research-exposure:

    runs-on: ubuntu-latest

    timeout-minutes: 180

    # ==========================================================
    # HUGGING FACE AUTHENTICATION
    #
    # Create this repository secret:
    #
    # Settings
    # -> Secrets and variables
    # -> Actions
    # -> New repository secret
    #
    # Name:
    # HF_TOKEN
    #
    # Value:
    # Your Hugging Face read token
    # ==========================================================
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ========================================================
      # 2. SETUP PYTHON
      # ========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ========================================================
      # 3. VERIFY REQUIRED FILES
      #
      # IMPORTANT:
      # The current fund universe is Funds Links.xlsx
      # ========================================================
      - name: Verify required files
        shell: bash
        run: |
          set -e

          echo "Checking required files..."

          test -f "Funds Links.xlsx"
          test -f "scripts/research_fund_exposure.py"
          test -f "scripts/exposure_categories.txt"

          echo
          echo "Required files found:"
          ls -lh "Funds Links.xlsx"
          ls -lh "scripts/research_fund_exposure.py"
          ls -lh "scripts/exposure_categories.txt"

          echo
          echo "Required file check passed."

      # ========================================================
      # 4. SHOW EXPOSURE VOCABULARY
      # ========================================================
      - name: Show exposure vocabulary
        shell: bash
        run: |
          echo "============================================================"
          echo "Allowed Geography / Sector Vocabulary"
          echo "============================================================"

          cat scripts/exposure_categories.txt

          echo "============================================================"

      # ========================================================
      # 5. CHECK HUGGING FACE TOKEN
      # ========================================================
      - name: Check Hugging Face authentication
        shell: bash
        run: |
          set -e

          if [ -z "${HF_TOKEN:-}" ]; then
            echo "WARNING: HF_TOKEN is not configured."
            echo
            echo "The Hugging Face Hub will use unauthenticated requests."
            echo "Create repository secret HF_TOKEN for higher rate limits"
            echo "and faster model downloads."
            echo
          else
            echo "HF_TOKEN is configured."
            echo "Hugging Face authenticated downloads are enabled."
          fi

      # ========================================================
      # 6. INSTALL DEPENDENCIES
      # ========================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install \
            "torch>=2.5" \
            "transformers>=4.51" \
            "accelerate>=1.0" \
            "openpyxl>=3.1" \
            "pypdf>=5.0" \
            "beautifulsoup4>=4.12" \
            "requests>=2.32"

      # ========================================================
      # 7. RUN AI FUND EXPOSURE RESEARCH
      #
      # FIRST TEST:
      # Only process 1 fund.
      #
      # After this works, remove "--limit 1".
      # ========================================================
      - name: Research fund geography and sector
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -e

          echo "============================================================"
          echo "Starting AI Fund Exposure Research"
          echo "============================================================"
          echo
          echo "Input:"
          echo "  Funds Links.xlsx"
          echo
          echo "Model:"
          echo "  Qwen/Qwen3-1.7B"
          echo
          echo "Mode:"
          echo "  TEST - first fund only"
          echo
          echo "============================================================"

          python scripts/research_fund_exposure.py --limit 1

      # ========================================================
      # 8. VERIFY OUTPUT
      # ========================================================
      - name: Verify output
        shell: bash
        run: |
          set -e

          OUTPUT="data/fund_exposure.json"

          if [ ! -f "$OUTPUT" ]; then
            echo "ERROR: $OUTPUT was not created."
            exit 1
          fi

          echo "Output created:"
          ls -lh "$OUTPUT"

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/fund_exposure.json")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: Output JSON root is not an object."
              )

          if "funds" not in data:
              raise SystemExit(
                  "ERROR: Output JSON does not contain 'funds'."
              )

          if not isinstance(data["funds"], list):
              raise SystemExit(
                  "ERROR: 'funds' is not a list."
              )

          print(
              f"Funds researched: {len(data['funds'])}"
          )

          for i, fund in enumerate(
              data["funds"],
              start=1,
          ):

              if not isinstance(fund, dict):
                  raise SystemExit(
                      f"ERROR: Fund record #{i} is not an object."
                  )

              geography = fund.get(
                  "geography",
                  [],
              )

              sector = fund.get(
                  "sector",
                  [],
              )

              if not isinstance(
                  geography,
                  list,
              ):
                  raise SystemExit(
                      f"ERROR: Fund #{i} geography is not a list."
                  )

              if not isinstance(
                  sector,
                  list,
              ):
                  raise SystemExit(
                      f"ERROR: Fund #{i} sector is not a list."
                  )

              if len(geography) > 3:
                  raise SystemExit(
                      f"ERROR: Fund #{i} has more than "
                      "3 geography categories."
                  )

              if len(sector) > 3:
                  raise SystemExit(
                      f"ERROR: Fund #{i} has more than "
                      "3 sector categories."
                  )

              for category in (
                  geography + sector
              ):

                  if not isinstance(
                      category,
                      str,
                  ):
                      raise SystemExit(
                          f"ERROR: Fund #{i} contains "
                          "non-string category."
                      )

                  if "%" in category:
                      raise SystemExit(
                          f"ERROR: Percentage found in "
                          f"fund #{i}: {category}"
                      )

          print(
              "Output validation passed."
          )

          PY

      # ========================================================
      # 9. SHOW RESEARCH SUMMARY
      # ========================================================
      - name: Show research summary
        shell: bash
        run: |
          python - <<'PY'
          import json

          with open(
              "data/fund_exposure.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          summary = data.get(
              "summary",
              {},
          )

          print("")
          print(
              "============================================================"
          )
          print(
              "FUND EXPOSURE RESEARCH SUMMARY"
          )
          print(
              "============================================================"
          )

          for key, value in summary.items():
              print(
                  f"{key}: {value}"
              )

          print(
              "============================================================"
          )
          print("")

          PY

      # ========================================================
      # 10. CONFIGURE GIT
      # ========================================================
      - name: Configure Git
        shell: bash
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      # ========================================================
      # 11. CHECK FOR CHANGES
      # ========================================================
      - name: Check for changes
        id: changes
        shell: bash
        run: |
          git status --short

          if git diff --quiet -- data/fund_exposure.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in fund_exposure.json."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      # ========================================================
      # 12. COMMIT LOCAL RESULT
      # ========================================================
      - name: Commit exposure data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          git add data/fund_exposure.json

          git commit \
            -m "Update fund geography and sector exposure"

      # ========================================================
      # 13. SAFE PUSH
      #
      # The exposure workflow owns:
      #
      #   data/fund_exposure.json
      #
      # Other workflows own different files.
      #
      # Therefore we can rebase this commit onto the latest main
      # without rerunning the expensive AI research.
      # ========================================================
      - name: Push exposure data safely
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          BRANCH="${GITHUB_REF_NAME}"

          MAX_ATTEMPTS=5
          ATTEMPT=1

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]
          do

            echo
            echo "============================================================"
            echo "Push attempt $ATTEMPT / $MAX_ATTEMPTS"
            echo "============================================================"

            echo
            echo "Fetching latest $BRANCH..."

            git fetch origin "$BRANCH"

            echo
            echo "Local HEAD:"
            git rev-parse HEAD

            echo
            echo "Remote HEAD:"
            git rev-parse "origin/$BRANCH"

            echo
            echo "Rebasing exposure commit onto latest main..."

            if git rebase "origin/$BRANCH"; then

              echo
              echo "Rebase successful."

            else

              echo
              echo "============================================================"
              echo "ERROR: Rebase conflict detected."
              echo "============================================================"
              echo
              echo "Another commit modified the same files owned by"
              echo "the Fund Exposure workflow."
              echo
              echo "Aborting rebase."
              echo

              git rebase --abort || true

              exit 1

            fi

            echo
            echo "Pushing to $BRANCH..."

            if git push origin "HEAD:$BRANCH"; then

              echo
              echo "============================================================"
              echo "FUND EXPOSURE UPDATE PUBLISHED"
              echo "============================================================"
              echo
              echo "Published:"
              echo "  data/fund_exposure.json"
              echo
              echo "============================================================"

              exit 0

            fi

            echo
            echo "Push failed because origin/$BRANCH changed."
            echo
            echo "Another workflow probably pushed a new commit."
            echo "Fetching the latest main and retrying."
            echo

            ATTEMPT=$((ATTEMPT + 1))

            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep 5
            fi

          done

          echo
          echo "============================================================"
          echo "ERROR: Unable to publish fund exposure data."
          echo "============================================================"
          echo
          echo "The remote branch continued changing after"
          echo "$MAX_ATTEMPTS push attempts."
          echo
          exit 1
