name: Test Gemini Request

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gemini-request:
    name: Diagnose Gemini Request Configuration
    runs-on: ubuntu-latest

    concurrency:
      group: test-gemini-request
      cancel-in-progress: false

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================================
      # NO PIP / NO EXTERNAL DEPENDENCIES
      #
      # test_gemini_request.py uses Python standard library only.
      # ==========================================================

      - name: Verify diagnostic inputs
        run: |
          test -f "scripts/test_gemini_request.py"
          test -f "data/market_news/current.json"

          echo "Diagnostic script:"
          ls -lh "scripts/test_gemini_request.py"

          echo ""
          echo "Production current.json:"
          ls -lh "data/market_news/current.json"

      # ==========================================================
      # GEMINI REQUEST DIAGNOSTIC
      #
      # IMPORTANT:
      # No GEMINI_MODEL is specified here.
      #
      # The default is gemini-3.8-flash, which your previous
      # API diagnostic successfully generated against with HTTP 200.
      # ==========================================================

      - name: Run Gemini request diagnostic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_DIAGNOSTIC_TIMEOUT_SECONDS: "120"
        run: |
          python -u scripts/test_gemini_request.py
