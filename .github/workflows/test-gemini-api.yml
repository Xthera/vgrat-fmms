name: Test Gemini API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gemini-api:
    name: Diagnose Gemini API Access
    runs-on: ubuntu-latest

    concurrency:
      group: test-gemini-api
      cancel-in-progress: false

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ==========================================================
      # VERIFY SCRIPT
      # ==========================================================

      - name: Verify diagnostic script
        run: |
          test -f "scripts/test_gemini_api.py"
          echo "Diagnostic script found:"
          ls -lh "scripts/test_gemini_api.py"

      # ==========================================================
      # GEMINI DIAGNOSTIC
      #
      # Do NOT set a specific model here.
      #
      # The Python script will:
      #   1. list all models available to the API key
      #   2. identify generateContent-capable models
      #   3. select an available model
      #   4. perform one minimal generation request
      #
      # This prevents us from guessing model names.
      # ==========================================================

      - name: Run Gemini API diagnostic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_DIAGNOSTIC_TIMEOUT_SECONDS: "60"
        run: |
          python -u scripts/test_gemini_api.py
