name: Fund Factsheet Geographic and Sector Exposure

on:
  workflow_dispatch:

  # Monthly automatic refresh
  # Singapore time: 1st day of every month at 02:00 SGT
  # 02:00 SGT = 18:00 UTC previous day
  schedule:
    - cron: "0 18 1 * *"

permissions:
  contents: write

concurrency:
  group: fund-factsheet-exposure
  cancel-in-progress: false

jobs:
  extract-fund-factsheet-exposure:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # --------------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------------
      # 3. Install shared dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # --------------------------------------------------------
      # 4. Check required files
      # --------------------------------------------------------
      - name: Check required files
        run: |
          test -f "Funds Links.xlsm"
          test -f "scripts/fetch_fundfactsheet_exposure.py"
          test -f "scripts/requirements.txt"

      # --------------------------------------------------------
      # 5. Run factsheet extraction
      # --------------------------------------------------------
      - name: Extract geographic and sector exposure
        run: |
          python scripts/fetch_fundfactsheet_exposure.py

      # --------------------------------------------------------
      # 6. Validate output
      # --------------------------------------------------------
      - name: Validate output
        run: |
          test -f "data/fundfactsheet_exposure.json"
          test -f "data/fundfactsheet_exposure_diagnostics.json"

          python - <<'PY'
          import json
          import sys

          output_path = "data/fundfactsheet_exposure.json"
          diagnostics_path = "data/fundfactsheet_exposure_diagnostics.json"

          with open(output_path, "r", encoding="utf-8") as f:
              data = json.load(f)

          with open(diagnostics_path, "r", encoding="utf-8") as f:
              diagnostics = json.load(f)

          funds = data.get("funds", [])

          print("========================================")
          print("Fund Factsheet Exposure Extraction")
          print("========================================")
          print("Fund count:", len(funds))

          statuses = {}

          for fund in funds:
              status = fund.get("status", "unknown")
              statuses[status] = statuses.get(status, 0) + 1

          print("Statuses:")

          for status, count in sorted(statuses.items()):
              print(f"  {status}: {count}")

          print("----------------------------------------")
          print("Output:", output_path)
          print("Diagnostics:", diagnostics_path)
          print("----------------------------------------")

          if not isinstance(funds, list):
              print("ERROR: 'funds' is not a list.")
              sys.exit(1)

          for index, fund in enumerate(funds, start=1):

              if not isinstance(fund, dict):
                  print(f"ERROR: Fund record {index} is not an object.")
                  sys.exit(1)

              if not fund.get("fundName"):
                  print(f"ERROR: Fund record {index} has no fundName.")
                  sys.exit(1)

          print("JSON validation passed.")
          PY

      # --------------------------------------------------------
      # 7. Show extraction summary
      # --------------------------------------------------------
      - name: Show extraction summary
        run: |
          python - <<'PY'
          import json

          path = "data/fundfactsheet_exposure.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          funds = data.get("funds", [])

          prudential = 0
          manager = 0
          unresolved = 0

          geographic = 0
          sector = 0
          both = 0

          for fund in funds:

              status = fund.get("status", "")

              if status == "resolved_prudential":
                  prudential += 1

              elif status == "resolved_manager":
                  manager += 1

              elif status == "unresolved":
                  unresolved += 1

              has_geo = bool(fund.get("geographicAllocation"))
              has_sector = bool(fund.get("sectorAllocation"))

              if has_geo:
                  geographic += 1

              if has_sector:
                  sector += 1

              if has_geo and has_sector:
                  both += 1

          print("")
          print("========================================")
          print("FINAL EXTRACTION SUMMARY")
          print("========================================")
          print("Total funds:              ", len(funds))
          print("Resolved from Prudential: ", prudential)
          print("Resolved from manager:     ", manager)
          print("Unresolved:                ", unresolved)
          print("----------------------------------------")
          print("Geographic allocation:     ", geographic)
          print("Sector allocation:         ", sector)
          print("Both geographic + sector:  ", both)
          print("========================================")
          PY

      # --------------------------------------------------------
      # 8. Commit ONLY factsheet research output
      # --------------------------------------------------------
      - name: Commit factsheet exposure JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fundfactsheet_exposure.json
          git add data/fundfactsheet_exposure_diagnostics.json

          if git diff --cached --quiet; then
            echo "No factsheet exposure changes to commit."
          else
            git commit -m "Update fund factsheet geographic and sector exposure"
            git push
          fi
