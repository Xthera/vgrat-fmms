name: Fund Factsheet Exposure

on:
  workflow_dispatch:

  schedule:
    # 02:00 Singapore time
    # Singapore = UTC+8
    # 02:00 SGT = 18:00 UTC previous day
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: fund-factsheet-exposure
  cancel-in-progress: false

jobs:
  extract-fund-exposure:

    runs-on: ubuntu-latest

    timeout-minutes: 120

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      # ======================================================
      # 3. INSTALL DEPENDENCIES
      # ======================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # 4. INSTALL PLAYWRIGHT BROWSER
      # ======================================================

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      # ======================================================
      # 5. VERIFY REQUIRED FILES
      # ======================================================

      - name: Verify repository files
        run: |
          test -f "Funds Links.xlsm"
          test -f "scripts/fetch_fundfactsheet_exposure.py"

          echo "Required files found."

      # ======================================================
      # 6. RUN EXTRACTION
      # ======================================================

      - name: Extract fund geographic and sector exposure
        run: |
          python scripts/fetch_fundfactsheet_exposure.py

      # ======================================================
      # 7. SHOW SUMMARY
      # ======================================================

      - name: Show extraction summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/fundfactsheet_exposure.json")

          if not path.exists():
              raise SystemExit(
                  "fundfactsheet_exposure.json was not created"
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          summary = data.get("summary", {})

          print("")
          print("========================================")
          print("FUND FACTSHEET EXPOSURE SUMMARY")
          print("========================================")
          print(f"Funds      : {summary.get('fundCount', 0)}")
          print(f"Resolved   : {summary.get('resolved', 0)}")
          print(f"Unresolved : {summary.get('unresolved', 0)}")
          print("========================================")
          print("")
          PY

      # ======================================================
      # 8. GIT STATUS
      # ======================================================

      - name: Check generated files
        run: |
          git status --short

      # ======================================================
      # 9. COMMIT ONLY THIS PIPELINE'S OUTPUT
      # ======================================================

      - name: Commit exposure data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fundfactsheet_exposure.json
          git add data/fundfactsheet_exposure_diagnostics.json

          if git diff --cached --quiet; then
            echo "No exposure data changes."
            exit 0
          fi

          git commit -m "Update fund factsheet exposure data"

          git push
