name: Fund Geographic and Sector Exposure - Google Discovery

on:
  workflow_dispatch:

  # Monthly refresh
  #
  # 02:00 Singapore time on the 1st of every month
  # = 18:00 UTC on the last day of the previous month
  #
  # This uses UTC because GitHub Actions cron is UTC.
  schedule:
    - cron: "0 18 28-31 * *"

permissions:
  contents: write

concurrency:
  group: fund-google-exposure
  cancel-in-progress: false

jobs:

  extract-fund-exposure:

    runs-on: ubuntu-latest

    timeout-minutes: 90

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================================
      # 2. PYTHON
      # ========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ========================================================
      # 3. INSTALL DEPENDENCIES
      # ========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # ========================================================
      # 4. CHECK GOOGLE CREDENTIALS
      # ========================================================

      - name: Check Google Search configuration
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "ERROR: GOOGLE_API_KEY GitHub Secret is missing."
            exit 1
          fi

          if [ -z "$GOOGLE_CSE_ID" ]; then
            echo "ERROR: GOOGLE_CSE_ID GitHub Secret is missing."
            exit 1
          fi

          echo "Google Search credentials are configured."

      # ========================================================
      # 5. CHECK FILES
      # ========================================================

      - name: Check required files
        run: |
          test -f "Funds Links.xlsm"
          test -f "scripts/fetch_fundfactsheet_exposure.py"
          test -f "scripts/requirements.txt"

      # ========================================================
      # 6. RUN EXTRACTION
      # ========================================================

      - name: Search and extract geographic and sector exposure
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: |
          python scripts/fetch_fundfactsheet_exposure.py

      # ========================================================
      # 7. VALIDATE OUTPUT
      # ========================================================

      - name: Validate JSON output
        run: |
          test -f "data/fundfactsheet_exposure.json"
          test -f "data/fundfactsheet_exposure_diagnostics.json"

          python - <<'PY'
          import json
          import sys

          output_path = "data/fundfactsheet_exposure.json"
          diagnostics_path = "data/fundfactsheet_exposure_diagnostics.json"

          with open(output_path, "r", encoding="utf-8") as f:
              data = json.load(f)

          with open(diagnostics_path, "r", encoding="utf-8") as f:
              diagnostics = json.load(f)

          funds = data.get("funds")

          if not isinstance(funds, list):
              print("ERROR: funds is not a list")
              sys.exit(1)

          if not funds:
              print("ERROR: no funds returned")
              sys.exit(1)

          required_fields = [
              "fundName",
              "geographicAllocation",
              "sectorAllocation",
              "status",
              "retrievedAt",
          ]

          for index, fund in enumerate(funds, start=1):

              if not isinstance(fund, dict):
                  print(
                      f"ERROR: fund {index} is not an object"
                  )
                  sys.exit(1)

              for field in required_fields:

                  if field not in fund:
                      print(
                          f"ERROR: fund {index} "
                          f"missing {field}"
                      )
                      sys.exit(1)

          print("JSON validation passed.")
          print("Fund count:", len(funds))
          print(
              "Diagnostics records:",
              len(diagnostics.get("funds", []))
          )
          PY

      # ========================================================
      # 8. DISPLAY SUMMARY
      # ========================================================

      - name: Display extraction summary
        run: |
          python - <<'PY'
          import json

          path = "data/fundfactsheet_exposure.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          summary = data.get("summary", {})

          print("")
          print("==============================================")
          print("VGrat FMS GOOGLE EXPOSURE EXTRACTION")
          print("==============================================")
          print(
              "Total funds:",
              summary.get("fundCount", 0)
          )
          print(
              "Fully resolved:",
              summary.get("resolvedCount", 0)
          )
          print(
              "Partially resolved:",
              summary.get("partiallyResolvedCount", 0)
          )
          print(
              "Unresolved:",
              summary.get("unresolvedCount", 0)
          )
          print("----------------------------------------------")
          print(
              "Geographic data:",
              summary.get("geographicCount", 0)
          )
          print(
              "Sector data:",
              summary.get("sectorCount", 0)
          )
          print("==============================================")
          PY

      # ========================================================
      # 9. SHOW UNRESOLVED FUNDS
      # ========================================================

      - name: Show unresolved funds
        run: |
          python - <<'PY'
          import json

          path = "data/fundfactsheet_exposure.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          unresolved = [
              fund
              for fund in data.get("funds", [])
              if fund.get("status") == "unresolved"
          ]

          print("")
          print("==============================================")
          print("UNRESOLVED FUNDS")
          print("==============================================")

          if not unresolved:
              print("None")
          else:
              for fund in unresolved:
                  print(
                      "-",
                      fund.get("fundName"),
                      "|",
                      fund.get("reason")
                  )

          print("==============================================")
          PY

      # ========================================================
      # 10. COMMIT ONLY NEW OUTPUT
      # ========================================================

      - name: Commit exposure data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fundfactsheet_exposure.json
          git add data/fundfactsheet_exposure_diagnostics.json

          if git diff --cached --quiet; then
            echo "No geographic/sector exposure changes."
          else
            git commit \
              -m "Update fund geographic and sector exposure"

            git push
          fi
