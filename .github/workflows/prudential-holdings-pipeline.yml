      - name: "Verify pipeline files"
        run: |
          echo "============================================================"
          echo "VERIFYING PIPELINE FILES"
          echo "============================================================"

          echo ""
          echo "Repository root:"
          pwd

          echo ""
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort

          echo ""
          echo "Checking Funds Links.xlsm..."
          if [ -f "Funds Links.xlsm" ]; then
            echo "OK: Funds Links.xlsm"
          else
            echo "MISSING: Funds Links.xlsm"
          fi

          echo ""
          echo "Python scripts:"
          find scripts -maxdepth 1 -type f -name "*.py" -print 2>/dev/null | sort || true

          echo ""
          echo "Checking frozen baseline..."
          if [ -f "scripts/test_prudential_holdings.py" ]; then
            echo "OK: scripts/test_prudential_holdings.py"
          else
            echo "MISSING: scripts/test_prudential_holdings.py"
          fi

          echo ""
          echo "Checking Recovery 1..."
          if [ -f "scripts/recover_prudential_holdings.py" ]; then
            echo "OK: scripts/recover_prudential_holdings.py"
          else
            echo "MISSING: scripts/recover_prudential_holdings.py"
          fi

          echo ""
          echo "Checking Recovery 2..."
          if [ -f "scripts/recover_prudential_holdings_2.py" ]; then
            echo "OK: scripts/recover_prudential_holdings_2.py"
          else
            echo "MISSING: scripts/recover_prudential_holdings_2.py"
          fi

          echo ""
          echo "============================================================"
          echo "END FILE CHECK"
          echo "============================================================"
