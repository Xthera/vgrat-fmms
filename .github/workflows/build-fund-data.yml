name: VGrat FMS Fund Data Build

on:
  workflow_dispatch:

jobs:
  build-fund-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Run production fund-data builder
        run: |
          python build_fund_data.py

      - name: Upload production output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vgrat-fms-build-${{ github.run_number }}
          path: |
            output_pruaccess/production/
            output_pruaccess/runs/
          if-no-files-found: warn
